<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Graph - Manual de Operación Gatera CBA La Perla</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- D3.js CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #141417;
      --bg-surface: #1e1e24;
      --bg-surface-elevated: #282830;
      --border-subtle: #2f2f3d;
      --border-focus: #7c3aed;
      --text-normal: #dcddde;
      --text-muted: #8b8d98;
      --text-bright: #ffffff;
      --accent-purple: #a855f7;
      --accent-purple-glow: rgba(168, 85, 247, 0.35);
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --accent-violet: #8b5cf6;
      --accent-green: #22c55e;
      --sidebar-width: 440px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-normal);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Obsidian App Bar */
    header.obsidian-bar {
      height: 48px;
      background-color: #111114;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-bright);
    }

    .brand-icon {
      color: var(--accent-purple);
      display: flex;
      align-items: center;
    }

    .vault-tag {
      font-size: 11px;
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-wrapper input {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-bright);
      padding: 6px 10px 6px 30px;
      border-radius: 6px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 220px;
      transition: all 0.2s;
    }

    .search-wrapper input:focus {
      border-color: var(--accent-purple);
      width: 270px;
      box-shadow: 0 0 10px var(--accent-purple-glow);
    }

    .search-icon {
      position: absolute;
      left: 9px;
      color: var(--text-muted);
      pointer-events: none;
      width: 14px;
      height: 14px;
    }

    .view-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-normal);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .view-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-bright);
      border-color: var(--border-focus);
    }

    .view-btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--accent-purple);
      color: var(--accent-purple);
    }

    /* Main Container */
    .app-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Graph Canvas Area */
    .graph-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1b1b22 0%, #121215 100%);
      cursor: grab;
      overflow: hidden;
    }

    .graph-container:active {
      cursor: grabbing;
    }

    canvas#graph-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Graph Controls */
    .graph-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(30, 30, 36, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-normal);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .ctrl-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-bright);
      border-color: var(--border-subtle);
    }

    /* Category Legend Pill */
    .legend-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(22, 22, 27, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 580px;
      z-index: 10;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .legend-item:hover, .legend-item.active {
      color: var(--text-bright);
      background: rgba(255, 255, 255, 0.06);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Side Obsidian Note Pane */
    .note-panel {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), width 0.25s ease;
      z-index: 15;
    }

    .note-panel.collapsed {
      transform: translateX(100%);
      width: 0;
      border-left: none;
    }

    .note-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #17171c;
    }

    .note-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .note-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      color: var(--text-bright);
      background: var(--bg-surface-elevated);
    }

    .note-scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      user-select: text;
    }

    .note-scroll-content::-webkit-scrollbar {
      width: 6px;
    }

    .note-scroll-content::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }

    /* Obsidian Markdown Styling */
    .frontmatter {
      background: rgba(0, 0, 0, 0.25);
      border: 1px dashed var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .frontmatter-row {
      display: flex;
      margin-bottom: 4px;
    }

    .fm-key {
      width: 90px;
      color: var(--accent-purple);
    }

    .fm-val {
      color: var(--text-normal);
    }

    .note-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 16px;
      line-height: 1.25;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .note-body p {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-normal);
      margin-bottom: 14px;
    }

    .note-body ul, .note-body ol {
      margin-left: 20px;
      margin-bottom: 16px;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .note-body li {
      margin-bottom: 6px;
    }

    /* Obsidian Callouts */
    .callout {
      border-radius: 8px;
      padding: 12px 14px;
      margin: 16px 0;
      border-left: 4px solid var(--accent-purple);
      background: rgba(168, 85, 247, 0.08);
      font-size: 13px;
      line-height: 1.5;
    }

    .callout.callout-info {
      border-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.08);
    }

    .callout.callout-success {
      border-color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.08);
    }

    .callout.callout-warning {
      border-color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.08);
    }

    .callout-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      color: var(--text-bright);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    /* Obsidian Wikilink Pill */
    .wikilink {
      background: rgba(168, 85, 247, 0.16);
      color: #c084fc;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      transition: all 0.15s;
    }

    .wikilink:hover {
      background: rgba(168, 85, 247, 0.3);
      color: #f3e8ff;
      border-color: var(--accent-purple);
    }

    /* Backlinks & Connected Nodes Section */
    .connections-section {
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .connections-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Drawer Toggle Button when collapsed */
    .drawer-toggle-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-normal);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s;
    }

    .drawer-toggle-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-bright);
      border-color: var(--accent-purple);
    }

    /* Modal / Tooltip */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(22, 22, 28, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--accent-purple);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-bright);
      z-index: 100;
      display: none;
      max-width: 260px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Obsidian Top Application Bar -->
  <header class="obsidian-bar">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="network"></i></div>
      <span>Gatera CBA La Perla</span>
      <span class="vault-tag">Obsidian Graph v2.4</span>
    </div>

    <div class="header-actions">
      <div class="search-wrapper">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="node-search" placeholder="Filtrar notas o conceptos... (Cmd+F)">
      </div>
      <button class="view-btn active" id="btn-toggle-forces">
        <i data-lucide="sliders"></i> Física Dinámica
      </button>
      <button class="view-btn" id="btn-reset-zoom">
        <i data-lucide="maximize-2"></i> Centrar Grafo
      </button>
    </div>
  </header>

  <!-- Main Body -->
  <div class="app-body">

    <!-- Graph Canvas Container -->
    <div class="graph-container" id="graph-wrapper">
      <!-- Category Legend -->
      <div class="legend-panel">
        <div class="legend-item" data-group="hub"><span class="legend-dot" style="background: var(--accent-purple); box-shadow: 0 0 6px var(--accent-purple);"></span> Hub Central</div>
        <div class="legend-item" data-group="acceso"><span class="legend-dot" style="background: var(--accent-cyan)"></span> 1. Acceso & PWA</div>
        <div class="legend-item" data-group="offline"><span class="legend-dot" style="background: var(--accent-amber)"></span> 2. Modo Offline</div>
        <div class="legend-item" data-group="sync"><span class="legend-dot" style="background: var(--accent-blue)"></span> 3. Sincronización</div>
        <div class="legend-item" data-group="clinica"><span class="legend-dot" style="background: var(--accent-rose)"></span> 4. Gestión Clínica</div>
        <div class="legend-item" data-group="censo"><span class="legend-dot" style="background: var(--accent-emerald)"></span> 5. Censo & Rescates</div>
        <div class="legend-item" data-group="fallecidos"><span class="legend-dot" style="background: var(--accent-violet)"></span> 6. Bajas & Auditoría</div>
        <div class="legend-item" data-group="excel"><span class="legend-dot" style="background: var(--accent-green)"></span> 7. Excel Maestro</div>
      </div>

      <!-- Controls Bottom Left -->
      <div class="graph-controls">
        <button class="ctrl-btn" id="zoom-in" title="Acercar"><i data-lucide="zoom-in"></i></button>
        <button class="ctrl-btn" id="zoom-out" title="Alejar"><i data-lucide="zoom-out"></i></button>
        <button class="ctrl-btn" id="toggle-particles" title="Activar/Desactivar Pulsos"><i data-lucide="activity"></i></button>
      </div>

      <canvas id="graph-canvas"></canvas>

      <button class="drawer-toggle-btn" id="open-pane-btn" style="display: none;">
        <i data-lucide="panel-right-open"></i> Ver Nota
      </button>
    </div>

    <!-- Side Obsidian Markdown Preview Drawer -->
    <aside class="note-panel" id="note-pane">
      <div class="note-header">
        <div class="note-breadcrumb">
          <i data-lucide="file-text" style="width: 14px; height: 14px;"></i>
          <span id="note-category-label">Manual / Módulos</span>
        </div>
        <div class="note-actions">
          <button class="icon-btn" id="close-pane-btn" title="Ocultar Panel"><i data-lucide="panel-right-close"></i></button>
        </div>
      </div>

      <div class="note-scroll-content" id="note-view">
        <!-- Dynamic Markdown Render will be inserted here -->
      </div>
    </aside>

  </div>

  <!-- Tooltip Element -->
  <div id="tooltip"></div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // -------------------------------------------------------------------------
    // GRAPH DATA: Nodes & Links derived from the User's Manual
    // -------------------------------------------------------------------------

        // 1. ACCESO Y PRIMER INGRESO

        {

        {

        {

    // OBSIDIAN GRAPH RENDERING ENGINE (HTML5 Canvas + D3-Force)
    // -------------------------------------------------------------------------
    const canvas = document.getElementById("graph-canvas");
    const ctx = canvas.getContext("2d");
    const wrapper = document.getElementById("graph-wrapper");
    const tooltip = document.getElementById("tooltip");

    let width = wrapper.clientWidth;
    let height = wrapper.clientHeight;
    let transform = d3.zoomIdentity;
    let selectedNode = graphData.nodes[0]; // Start with Hub
    let hoveredNode = null;
    let enableParticles = true;
    let particles = [];
    let isPhysicsActive = true;

    // Set Canvas DPI
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      width = wrapper.clientWidth;
      height = wrapper.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.scale(dpr, dpr);
    }
    resizeCanvas();
    window.addEventListener("resize", () => {
      resizeCanvas();
      simulation.center(width / 2, height / 2);
    });

    // D3 Force Simulation
    const simulation = d3.forceSimulation(graphData.nodes)
      .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(d => {
        if (d.source.id === "hub" || d.target.id === "hub") return 160;
        return 85;
      }).strength(0.7))
      .force("charge", d3.forceManyBody().strength(d => d.id === "hub" ? -600 : -220))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide().radius(d => d.val * 2.2));

    // Particle flow animation on links
    function initParticles() {
      particles = [];
      for (let i = 0; i < 28; i++) {
        const link = graphData.links[Math.floor(Math.random() * graphData.links.length)];
        particles.push({
          link: link,
          progress: Math.random(),
          speed: 0.004 + Math.random() * 0.007
        });
      }
    }
    initParticles();

    // D3 Zoom Setup
    const zoom = d3.zoom()
      .scaleExtent([0.15, 4])
      .on("zoom", (event) => {
        transform = event.transform;
      });

    d3.select(canvas)
      .call(zoom)
      .on("dblclick.zoom", null);

    // Main Draw Function (Canvas 60fps loop)
    function render() {
      ctx.save();
      ctx.clearRect(0, 0, width, height);

      // Apply zoom & pan transform
      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.k, transform.k);

      // Connected nodes set for highlight
      const activeNode = hoveredNode || selectedNode;
      const connectedNodeIds = new Set();
      if (activeNode) {
        connectedNodeIds.add(activeNode.id);
        graphData.links.forEach(l => {
          if (l.source.id === activeNode.id) connectedNodeIds.add(l.target.id);
          if (l.target.id === activeNode.id) connectedNodeIds.add(l.source.id);
        });
      }

      // 1. Draw Links
      graphData.links.forEach(link => {
        const isHighlight = activeNode && (link.source.id === activeNode.id || link.target.id === activeNode.id);
        const isDimmed = activeNode && !isHighlight;

        ctx.beginPath();
        ctx.moveTo(link.source.x, link.source.y);
        ctx.lineTo(link.target.x, link.target.y);
        ctx.lineWidth = isHighlight ? 2.5 : 1.2;
        ctx.strokeStyle = isHighlight 
          ? "rgba(168, 85, 247, 0.85)" 
          : isDimmed 
            ? "rgba(47, 47, 61, 0.25)" 
            : "rgba(75, 75, 95, 0.45)";
        ctx.stroke();
      });

      // 2. Draw Animated Particles
      if (enableParticles && (!activeNode || connectedNodeIds.size > 0)) {
        particles.forEach(p => {
          p.progress += p.speed;
          if (p.progress > 1) p.progress = 0;

          const sx = p.link.source.x;
          const sy = p.link.source.y;
          const tx = p.link.target.x;
          const ty = p.link.target.y;

          const px = sx + (tx - sx) * p.progress;
          const py = sy + (ty - sy) * p.progress;

          const isHighlight = activeNode && (p.link.source.id === activeNode.id || p.link.target.id === activeNode.id);

          ctx.beginPath();
          ctx.arc(px, py, isHighlight ? 2.8 : 1.8, 0, 2 * Math.PI);
          ctx.fillStyle = isHighlight ? "#c084fc" : "rgba(168, 85, 247, 0.4)";
          ctx.fill();
        });
      }

      // 3. Draw Nodes
      graphData.nodes.forEach(node => {
        const isSelected = selectedNode && node.id === selectedNode.id;
        const isHovered = hoveredNode && node.id === hoveredNode.id;
        const isConnected = connectedNodeIds.has(node.id);
        const isDimmed = activeNode && !isConnected;

        const radius = node.val;

        ctx.save();
        ctx.translate(node.x, node.y);

        // Ambient Outer Glow
        if (isSelected || isHovered) {
          const glowRadius = radius * 2.2;
          const grad = ctx.createRadialGradient(0, 0, radius * 0.5, 0, 0, glowRadius);
          grad.addColorStop(0, node.color);
          grad.addColorStop(1, "transparent");
          ctx.beginPath();
          ctx.arc(0, 0, glowRadius, 0, 2 * Math.PI);
          ctx.fillStyle = grad;
          ctx.fill();
        }

        // Selection Border Ring
        if (isSelected) {
          ctx.beginPath();
          ctx.arc(0, 0, radius + 5, 0, 2 * Math.PI);
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }

        // Main Node Circle
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, 2 * Math.PI);
        ctx.fillStyle = isDimmed ? "rgba(45, 45, 55, 0.4)" : node.color;
        ctx.fill();

        // Node Inner Highlight/Bevel
        if (!isDimmed) {
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, 2 * Math.PI);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        // Node Labels (Obsidian Style Text)
        const showLabel = transform.k > 0.45 || node.val > 14 || isConnected;
        if (showLabel) {
          ctx.font = `${node.id === "hub" ? "bold 13px" : "500 11px"} 'Inter', sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          // Text Background Shadow
          ctx.fillStyle = "rgba(18, 18, 22, 0.85)";
          const textWidth = ctx.measureText(node.title).width;
          ctx.fillRect(-textWidth / 2 - 4, radius + 5, textWidth + 8, 18);

          // Text
          ctx.fillStyle = isDimmed ? "rgba(139, 141, 152, 0.3)" : (isSelected || isConnected ? "#ffffff" : "#c6c7cd");
          ctx.fillText(node.title, 0, radius + 14);
        }

        ctx.restore();
      });

      ctx.restore();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // -------------------------------------------------------------------------
    // INTERACTION: MOUSE & TOUCH EVENTS
    // -------------------------------------------------------------------------
    function getNodeAt(x, y) {
      const graphX = (x - transform.x) / transform.k;
      const graphY = (y - transform.y) / transform.k;

      for (let i = graphData.nodes.length - 1; i >= 0; i--) {
        const node = graphData.nodes[i];
        const dist = Math.hypot(node.x - graphX, node.y - graphY);
        if (dist <= node.val + 6) return node;
      }
      return null;
    }

    // Drag behavior via Canvas
    let draggedNode = null;

    canvas.addEventListener("mousedown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const node = getNodeAt(e.clientX - rect.left, e.clientY - rect.top);
      if (node) {
        draggedNode = node;
        node.fx = node.x;
        node.fy = node.y;
        simulation.alphaTarget(0.3).restart();
      }
    });

    window.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (draggedNode) {
        draggedNode.fx = (mouseX - transform.x) / transform.k;
        draggedNode.fy = (mouseY - transform.y) / transform.k;
      } else {
        const node = getNodeAt(mouseX, mouseY);
        hoveredNode = node;

        if (node) {
          canvas.style.cursor = "pointer";
          tooltip.style.display = "block";
          tooltip.style.left = (e.clientX + 14) + "px";
          tooltip.style.top = (e.clientY + 14) + "px";
          tooltip.innerHTML = `
            <div style="font-weight: 600; color: ${node.color}; margin-bottom: 3px;">${node.title}</div>
            <div style="font-size: 11px; color: #a1a1aa;">${node.summary}</div>
            <div style="margin-top: 5px; font-size: 10px; font-family: monospace; color: #71717a;">Click para abrir nota</div>
          `;
        } else {
          canvas.style.cursor = "grab";
          tooltip.style.display = "none";
        }
      }
    });

    window.addEventListener("mouseup", () => {
      if (draggedNode) {
        if (!draggedNode.fixed) {
          draggedNode.fx = null;
          draggedNode.fy = null;
        }
        draggedNode = null;
        simulation.alphaTarget(0);
      }
    });

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const node = getNodeAt(e.clientX - rect.left, e.clientY - rect.top);
      if (node) {
        selectNode(node);
      }
    });

    // Node Selection & Obsidian Note Rendering
    function selectNode(node) {
      selectedNode = node;
      renderNotePanel(node);

      // Smooth pan camera towards the selected node
      const targetX = width / 2 - node.x * transform.k;
      const targetY = height / 2 - node.y * transform.k;

      d3.select(canvas).transition()
        .duration(600)
        .call(zoom.transform, d3.zoomIdentity.translate(targetX, targetY).scale(Math.max(transform.k, 1.15)));
    }

    function selectNodeById(id) {
      const node = graphData.nodes.find(n => n.id === id);
      if (node) selectNode(node);
    }

    function renderNotePanel(node) {
      const pane = document.getElementById("note-pane");
      const openBtn = document.getElementById("open-pane-btn");
      pane.classList.remove("collapsed");
      openBtn.style.display = "none";

      document.getElementById("note-category-label").textContent = `Manual / ${node.category}`;

      // Calculate connected nodes for backlinks
      const connected = [];
      graphData.links.forEach(l => {
        if (l.source.id === node.id) connected.push(l.target);
        if (l.target.id === node.id) connected.push(l.source);
      });

      const uniqueConnected = Array.from(new Set(connected));

      const tagPills = node.tags.map(t => `<span class="vault-tag">${t}</span>`).join(" ");

      const linksHtml = uniqueConnected.map(targetNode => `
        <span class="wikilink" onclick="selectNodeById('${targetNode.id}')">
          <i data-lucide="corner-down-right" style="width: 12px; height: 12px;"></i>
          ${targetNode.title}
        </span>
      `).join("");

      document.getElementById("note-view").innerHTML = `
        <div style="margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px;">
          ${tagPills}
        </div>
        <div class="note-body">
          ${node.content}
        </div>
        <div class="connections-section">
          <div class="connections-title">
            <i data-lucide="git-branch" style="width: 14px; height: 14px;"></i>
            Conexiones y Referencias (${uniqueConnected.length})
          </div>
          <div class="links-grid">
            ${linksHtml || '<span style="font-size: 12px; color: var(--text-muted);">Sin conexiones salientes</span>'}
          </div>
        </div>
      `;

      lucide.createIcons();
    }

    // Initialize with Hub Content
    renderNotePanel(selectedNode);

    // -------------------------------------------------------------------------
    // CONTROLS & ACTIONS
    // -------------------------------------------------------------------------
    // Center Graph Zoom
    document.getElementById("btn-reset-zoom").addEventListener("click", () => {
      d3.select(canvas).transition().duration(750).call(
        zoom.transform,
        d3.zoomIdentity.translate(width / 2, height / 2).scale(0.85).translate(-graphData.nodes[0].x, -graphData.nodes[0].y)
      );
    });

    // Zoom Buttons
    document.getElementById("zoom-in").addEventListener("click", () => {
      d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 1.3);
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 0.7);
    });

    // Toggle Particles
    document.getElementById("toggle-particles").addEventListener("click", function() {
      enableParticles = !enableParticles;
      this.classList.toggle("active", enableParticles);
    });

    // Toggle Physics
    const btnForces = document.getElementById("btn-toggle-forces");
    btnForces.addEventListener("click", () => {
      isPhysicsActive = !isPhysicsActive;
      if (isPhysicsActive) {
        simulation.alphaTarget(0.3).restart();
        btnForces.classList.add("active");
      } else {
        simulation.stop();
        btnForces.classList.remove("active");
      }
    });

    // Close / Open Drawer
    document.getElementById("close-pane-btn").addEventListener("click", () => {
      document.getElementById("note-pane").classList.add("collapsed");
      document.getElementById("open-pane-btn").style.display = "flex";
    });

    document.getElementById("open-pane-btn").addEventListener("click", () => {
      document.getElementById("note-pane").classList.remove("collapsed");
      document.getElementById("open-pane-btn").style.display = "none";
    });

    // Real-time Search Filter
    const searchInput = document.getElementById("node-search");
    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        hoveredNode = null;
        return;
      }
      const match = graphData.nodes.find(n => 
        n.title.toLowerCase().includes(q) || 
        n.summary.toLowerCase().includes(q) ||
        n.tags.some(t => t.toLowerCase().includes(q))
      );
      if (match) {
        hoveredNode = match;
      }
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && hoveredNode) {
        selectNode(hoveredNode);
        searchInput.blur();
      }
    });

    // Legend Click Filter
    document.querySelectorAll(".legend-item").forEach(item => {
      item.addEventListener("click", () => {
        const group = item.getAttribute("data-group");
        const node = graphData.nodes.find(n => n.group === group);
        if (node) selectNode(node);
      });
    });

    // Keyboard Shortcuts (Esc to close, etc)
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        document.getElementById("note-pane").classList.add("collapsed");
        document.getElementById("open-pane-btn").style.display = "flex";
      }
    });
  </script>
</body>
</html>
